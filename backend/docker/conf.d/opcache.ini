; OPCache untuk `php artisan serve` (CLI SAPI).
; Dockerfile menggunakan php:8.3-cli-alpine dan `opcache.enable_cli` default OFF,
; sehingga setiap request membaca ulang seluruh file framework dari bind mount
; Windows (sangat lambat: 5-10 detik/request). Mengaktifkan opcache untuk CLI
; membuat respon turun ke ~0.02 detik.
opcache.enable=1
opcache.enable_cli=1
; validate_timestamps=0 => tidak mengecek mtime file pada setiap request.
; Bind mount Windows sangat lambat untuk operasi stat file (4-8 detik per
; request jika diaktifkan). Perubahan kode backend baru terlihat setelah
; `docker-compose restart backend`.
opcache.validate_timestamps=0
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
