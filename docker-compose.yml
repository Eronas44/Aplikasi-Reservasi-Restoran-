services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eronas-backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_db:/var/www/html/database
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8000/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped

volumes:
  backend_storage:
  backend_db:
