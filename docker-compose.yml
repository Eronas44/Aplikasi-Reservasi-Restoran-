services:
  # ==================== FRONTEND ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eronas-frontend
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      API_URL: http://backend:8000
      # URL backend yang bisa dijangkau browser pengguna (untuk gambar & aset publik).
      API_PUBLIC_URL: http://localhost:8080
    volumes:
      - ./frontend:/app:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - eronas-network

  # ==================== BACKEND ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eronas-backend
    ports:
      - "8080:8000"
    command: ["sh", "-c", "cd /var/www/html/public && exec php -S 0.0.0.0:8000 /var/www/html/vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      API_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: reservasi
      DB_USERNAME: reservasi
      DB_PASSWORD: reservasi123
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      PHP_INI_SCAN_DIR: /usr/local/etc/php/conf.d:/var/www/html/docker/conf.d
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_db:/var/www/html/database
      # Database SQLite tetap persisten di volume, tetapi file migrasi dari
      # workspace harus terlihat agar migrasi baru ikut dijalankan saat boot.
      - ./backend/database/migrations:/var/www/html/database/migrations:ro
      - ./backend:/var/www/html
      - ./backend/docker/conf.d:/var/www/html/docker/conf.d:ro
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "10", "-O", "-", "http://localhost:8000/up"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 25s
    restart: unless-stopped
    networks:
      - eronas-network

  # ==================== MYSQL ====================
  mysql:
    image: mysql:8.0
    container_name: eronas-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: reservasi
      MYSQL_USER: reservasi
      MYSQL_PASSWORD: reservasi123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -prootsecret --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - eronas-network

  # ==================== PHPMYADMIN ====================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: eronas-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootsecret
      UPLOAD_LIMIT: 128M
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - eronas-network

volumes:
  backend_storage:
  backend_db:
  mysql_data:

networks:
  eronas-network:
    driver: bridge
